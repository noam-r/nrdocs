name: verify

on:
  push:
    branches: [main, 'cursor/**', 'v2-bootstrap']
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify
        run: pnpm verify
      - name: Scan for removed 1.x concepts
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=nrdocs-specs --exclude-dir=node_modules --exclude-dir=dist --exclude='*.md' \
            -e 'github-oidc' -e 'owner/repo' -e 'auto-approval' \
            -e 'source-export' -e 'pending.?approval' \
            packages tests package.json; then
            echo 'Found forbidden 1.x concept markers in active implementation' >&2
            exit 1
          fi
          echo 'No forbidden 1.x implementation markers found'
